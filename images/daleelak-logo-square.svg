<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C4C"/>
      <stop offset="100%" stop-color="#134E6F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#F0C05A"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2FB6A8"/>
      <stop offset="100%" stop-color="#59D6C4"/>
    </linearGradient>
  </defs>

  <!-- خلفية مربعة -->
  <rect x="0" y="0" width="600" height="600" fill="url(#bgGrad)"/>

  <!-- إبرة بوصلة (رمز الدليل/الإرشاد) -->
  <g transform="translate(300,220)">
    <circle r="130" fill="none" stroke="#59D6C4" stroke-width="2" opacity="0.35"/>
    <g stroke="#59D6C4" stroke-width="3" opacity="0.5">
      <line x1="0" y1="-130" x2="0" y2="-112"/>
      <line x1="0" y1="130" x2="0" y2="112"/>
      <line x1="-130" y1="0" x2="-112" y2="0"/>
      <line x1="130" y1="0" x2="112" y2="0"/>
    </g>

    <!-- إبرة البوصلة -->
    <polygon points="0,-82 22,13 0,39 -22,13" fill="url(#accentGrad)"/>
    <polygon points="0,82 17,9 0,-13 -17,9" fill="#EAF6F4" opacity="0.9"/>
    <circle r="17" fill="#0F2C4C" stroke="url(#accentGrad)" stroke-width="4"/>

    <!-- قبعة تخرج مصغّرة -->
    <g transform="translate(0,-102)">
      <polygon points="0,-12 29,0 0,12 -29,0" fill="#EAF6F4"/>
      <polygon points="0,12 15,5 15,17 0,24 -15,17 -15,5" fill="#EAF6F4" opacity="0.85"/>
      <circle cx="26" cy="3" r="3" fill="#F2A93B"/>
      <line x1="26" y1="3" x2="26" y2="15" stroke="#F2A93B" stroke-width="2"/>
    </g>

    <!-- شرارات ذكاء اصطناعي -->
    <g transform="translate(68,-60)">
      <path d="M0,-14 L3.5,-3.5 L14,0 L3.5,3.5 L0,14 L-3.5,3.5 L-14,0 L-3.5,-3.5 Z" fill="#F2A93B"/>
    </g>
    <g transform="translate(-80,52) scale(0.6)">
      <path d="M0,-14 L3.5,-3.5 L14,0 L3.5,3.5 L0,14 L-3.5,3.5 L-14,0 L-3.5,-3.5 Z" fill="#59D6C4"/>
    </g>
  </g>

  <!-- الاسم -->
  <text x="300" y="470" text-anchor="middle" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#EAF6F4">دليلك</text>
  <text x="300" y="510" text-anchor="middle" font-family="Tahoma, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#59D6C4" letter-spacing="1">مساعدك الذكي لاختيار منصتك التعليمية</text>
</svg>
